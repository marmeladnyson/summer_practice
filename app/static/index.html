<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Заметки</h1>
      <a href="/docs" target="_blank" rel="noreferrer">Swagger</a>
    </header>

    <section class="user-section">
      <h2>Пользователь</h2>
      <p id="user-state" class="muted">Пользователь не выбран</p>
      <form id="user-form" class="form user-form">
        <label>Email<input id="email" type="email" placeholder="user@example.com" required></label>
        <label>Телефон<input id="phone" type="tel" placeholder="+79990000000" required></label>
        <button type="submit">Создать пользователя</button>
      </form>
    </section>

    <section class="notes-section">
      <div class="section-header">
        <h2>Заметки <span id="count">0</span></h2>
        <select id="filter" aria-label="Фильтр заметок">
          <option value="">Все</option>
          <option value="false">Активные</option>
          <option value="true">Выполненные</option>
        </select>
      </div>
      <form id="note-form" class="form note-form">
        <label>Новая заметка<input id="title" type="text" placeholder="Текст заметки" maxlength="200" required></label>
        <button type="submit">Добавить</button>
      </form>
      <div id="message" class="message" role="status"></div>
      <div id="notes" class="notes"></div>
      <div class="pagination">
        <button id="previous-page" type="button">Назад</button>
        <span id="page-info">Страница 1</span>
        <button id="next-page" type="button">Вперед</button>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
