services:
  - type: web
    name: summer-practice-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: summer-practice-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: summer-practice-db
    plan: free
    databaseName: notes
    user: notes